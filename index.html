<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retrato Provisório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0ede6;
    --surface: #e8e4dc;
    --ink: #61437c;
    --ink2: #61437c;
    --ink3: #8a8480;
    --accent: #1a1814;
    --border: rgba(26,24,20,0.18);
    --border-strong: rgba(41, 32, 43, 0.35);
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
  }

  /* grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.6;
  }

  header {
    border-bottom: 1px solid var(--border-strong);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
  }

  .logo {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .logo-tag {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink3);
    letter-spacing: 0.05em;
  }

  main {
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: calc(100vh - 57px);
  }

  /* SIDEBAR */
  .sidebar {
    border-right: 1px solid var(--border-strong);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    background: var(--surface);
  }

  .section-title {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .drop-area {
    border: 1.5px dashed var(--border-strong);
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    background: transparent;
  }
  .drop-area:hover, .drop-area.drag-over {
    border-color: var(--ink);
    background: rgba(26,24,20,0.04);
  }
  .drop-area svg { display: block; margin: 0 auto 0.75rem; opacity: 0.35; }
  .drop-area p {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink2);
    line-height: 1.6;
  }
  .drop-area em { color: var(--ink3); font-style: normal; font-size: 0.65rem; }

  .ctrl { margin-bottom: 1rem; }
  .ctrl label {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink2);
    margin-bottom: 0.5rem;
  }
  .ctrl label span {
    color: var(--ink);
    font-weight: 500;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: var(--border-strong);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    background: var(--ink);
    cursor: pointer;
    border-radius: 0;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    background: var(--ink);
    cursor: pointer;
    border-radius: 0;
    border: none;
  }

  select {
    width: 100%;
    padding: 0.45rem 0.6rem;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--ink);
    cursor: pointer;
    outline: none;
    border-radius: 0;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%231a1814' stroke-width='1.5'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 2rem;
  }

  .dl-btn {
    width: 100%;
    padding: 0.85rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--bg);
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: auto;
  }
  .dl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .dl-btn:not(:disabled):hover { opacity: 0.8; }

  /* CANVAS AREA */
  .canvas-area {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    overflow: auto;
  }

  .canvas-split {
    display: flex;
    gap: 0;
    border: 1px solid var(--border-strong);
    background: #fff;
    max-width: 100%;
    position: relative;
  }

  .canvas-pane {
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .pane-label {
    position: absolute;
    top: 0;
    left: 0;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--bg);
    padding: 3px 8px;
    z-index: 10;
  }

  .canvas-pane canvas,
  .canvas-pane img {
    display: block;
    max-width: 100%;
    image-rendering: pixelated;
  }

  .divider {
    width: 1px;
    background: var(--border-strong);
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    color: var(--ink3);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    text-align: center;
    width: 100%;
    height: 100%;
    min-height: 400px;
    letter-spacing: 0.05em;
  }
  .empty-state svg { opacity: 0.2; }

  /* halftone deco in empty state */
  .deco-grid {
    display: grid;
    grid-template-columns: repeat(8, 10px);
    gap: 6px;
    margin-bottom: 1rem;
  }
  .deco-dot {
    border-radius: 50%;
    background: var(--ink3);
  }

  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border-strong); }
    .canvas-split { flex-direction: column; }
    .divider { width: 100%; height: 1px; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">Retrato Provisório</span>
</header>

<main>
  <aside class="sidebar">

    <div>
      <div class="section-title">01 carregue sua imagem</div>
      <div class="drop-area" id="dropArea">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        <p>Arraste uma foto aqui<br>ou clique para escolher</p>
        <em>jpg, png, webp, gif</em>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <div>
      <div class="section-title">02 Edição</div>

      <div class="ctrl">
        <label>Resolução (largura px) <span id="resVal">80</span></label>
        <input type="range" id="resSlider" min="20" max="220" value="80" step="1">
      </div>
      <div class="ctrl">
        <label>Contraste <span id="contVal">1.4</span></label>
        <input type="range" id="contSlider" min="0.5" max="4.0" value="1.4" step="0.1">
      </div>
      <div class="ctrl">
        <label>Brilho <span id="brightVal">0</span></label>
        <input type="range" id="brightSlider" min="-100" max="100" value="0" step="1">
      </div>
      <div class="ctrl">
        <label>Stretch vertical <span id="stretchVal">1.20×</span></label>
        <input type="range" id="stretchSlider" min="0.6" max="2.5" value="1.20" step="0.05">
      </div>
    </div>

    <div>
      <div class="section-title">03 Tipo de efeito</div>

      <div class="ctrl">
        <select id="ditherSelect">
          <option value="floyd">Floyd-Steinberg</option>
          <option value="atkinson">Atkinson</option>
          <option value="ordered">Ordered / Bayer</option>
          <option value="jarvis">Jarvis-Judice-Ninke</option>
          <option value="threshold">Threshold simples</option>
        </select>
      </div>
      <div class="ctrl">
        <label>Escala de saída <span id="scaleVal">5×</span></label>
        <input type="range" id="scaleSlider" min="1" max="10" value="5" step="1">
      </div>
    </div>

    <div style="margin-top:auto">
      <div class="section-title">04 Exportar</div>
      <button class="dl-btn" id="dlBtn" disabled>↓ baixar PNG</button>
    </div>

  </aside>

  <section class="canvas-area" id="canvasArea">
    <div class="empty-state" id="emptyState">
      <div class="deco-grid" id="decoGrid"></div>
      suba uma imagem para começar
    </div>
    <div class="canvas-split" id="canvasSplit" style="display:none">
      <div class="canvas-pane" id="origPane">
        <span class="pane-label">original</span>
        <img id="origImg" alt="original">
      </div>
      <div class="divider"></div>
      <div class="canvas-pane" id="outPane">
        <span class="pane-label">dithered</span>
        <canvas id="outCanvas"></canvas>
      </div>
    </div>
  </section>
</main>

<script>
const fileInput = document.getElementById('fileInput');
const dropArea = document.getElementById('dropArea');
const resSlider = document.getElementById('resSlider');
const contSlider = document.getElementById('contSlider');
const brightSlider = document.getElementById('brightSlider');
const stretchSlider = document.getElementById('stretchSlider');
const ditherSelect = document.getElementById('ditherSelect');
const scaleSlider = document.getElementById('scaleSlider');
const dlBtn = document.getElementById('dlBtn');
const origImg = document.getElementById('origImg');
const outCanvas = document.getElementById('outCanvas');
const emptyState = document.getElementById('emptyState');
const canvasSplit = document.getElementById('canvasSplit');

let sourceImg = null;

// deco dots
const decoGrid = document.getElementById('decoGrid');
const sizes = [8,5,9,3,7,4,10,2, 4,8,3,9,5,10,2,7, 6,3,10,5,8,2,9,4, 3,9,4,7,2,8,5,10, 9,4,7,2,10,5,3,8, 5,2,8,4,3,9,7,6, 2,7,5,10,4,3,8,9, 7,6,2,8,10,4,9,3];
sizes.forEach(s => {
  const d = document.createElement('div');
  d.className = 'deco-dot';
  d.style.width = s + 'px';
  d.style.height = s + 'px';
  decoGrid.appendChild(d);
});

// drag drop
dropArea.addEventListener('click', () => fileInput.click());
dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('drag-over'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('drag-over'));
dropArea.addEventListener('drop', e => {
  e.preventDefault();
  dropArea.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

[resSlider, contSlider, brightSlider, stretchSlider, ditherSelect, scaleSlider].forEach(el => {
  el.addEventListener('input', () => { updateLabels(); if (sourceImg) process(); });
});

function updateLabels() {
  document.getElementById('resVal').textContent = resSlider.value;
  document.getElementById('contVal').textContent = parseFloat(contSlider.value).toFixed(1);
  document.getElementById('brightVal').textContent = brightSlider.value;
  document.getElementById('stretchVal').textContent = parseFloat(stretchSlider.value).toFixed(2) + '×';
  document.getElementById('scaleVal').textContent = scaleSlider.value + '×';
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      sourceImg = img;
      origImg.src = e.target.result;
      emptyState.style.display = 'none';
      canvasSplit.style.display = 'flex';
      process();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function process() {
  if (!sourceImg) return;
  const maxW = parseInt(resSlider.value);
  const stretch = parseFloat(stretchSlider.value);
  const contrast = parseFloat(contSlider.value);
  const brightness = parseInt(brightSlider.value);
  const scale = parseInt(scaleSlider.value);
  const algo = ditherSelect.value;

  const aspect = sourceImg.naturalHeight / sourceImg.naturalWidth;
  const w = maxW;
  const h = Math.round(w * aspect * stretch);

  // draw at low res
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const ctx = tmp.getContext('2d');
  ctx.drawImage(sourceImg, 0, 0, w, h);
  let data = ctx.getImageData(0, 0, w, h);
  let px = data.data;

  // grayscale + contrast + brightness
  for (let i = 0; i < px.length; i += 4) {
    let g = 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2];
    g = (g - 128) * contrast + 128 + brightness;
    g = Math.min(255, Math.max(0, g));
    px[i] = px[i+1] = px[i+2] = g;
  }

  const gray = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) gray[i] = px[i * 4];

  const out = new Uint8Array(w * h);

  if (algo === 'floyd') {
    const buf = Float32Array.from(gray);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      const nw = buf[idx] < 128 ? 0 : 255;
      out[idx] = nw;
      const err = buf[idx] - nw;
      if (x+1 < w) buf[idx+1] += err * 7/16;
      if (y+1 < h) {
        if (x-1 >= 0) buf[idx+w-1] += err * 3/16;
        buf[idx+w] += err * 5/16;
        if (x+1 < w) buf[idx+w+1] += err * 1/16;
      }
    }
  } else if (algo === 'atkinson') {
    const buf = Float32Array.from(gray);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      const nw = buf[idx] < 128 ? 0 : 255;
      out[idx] = nw;
      const err = (buf[idx] - nw) / 8;
      if (x+1 < w) buf[idx+1] += err;
      if (x+2 < w) buf[idx+2] += err;
      if (y+1 < h) {
        if (x-1 >= 0) buf[idx+w-1] += err;
        buf[idx+w] += err;
        if (x+1 < w) buf[idx+w+1] += err;
      }
      if (y+2 < h) buf[idx+w*2] += err;
    }
  } else if (algo === 'jarvis') {
    const buf = Float32Array.from(gray);
    const m = [7,5, 3,5,7,5,3, 1,3,5,3,1];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      const nw = buf[idx] < 128 ? 0 : 255;
      out[idx] = nw;
      const err = buf[idx] - nw;
      const spread = (dx, dy, w48) => { if (x+dx>=0&&x+dx<w&&y+dy<h) buf[(y+dy)*w+(x+dx)] += err*w48/48; };
      spread(1,0,7); spread(2,0,5);
      spread(-2,1,3); spread(-1,1,5); spread(0,1,7); spread(1,1,5); spread(2,1,3);
      spread(-2,2,1); spread(-1,2,3); spread(0,2,5); spread(1,2,3); spread(2,2,1);
    }
  } else if (algo === 'ordered') {
    const bayer = [0,48,12,60,3,51,15,63,32,16,44,28,35,19,47,31,8,56,4,52,11,59,7,55,40,24,36,20,43,27,39,23,2,50,14,62,1,49,13,61,34,18,46,30,33,17,45,29,10,58,6,54,9,57,5,53,42,26,38,22,41,25,37,21].map(v => v/64*255);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      out[idx] = gray[idx] > bayer[(y%8)*8+(x%8)] ? 255 : 0;
    }
  } else {
    for (let i = 0; i < w*h; i++) out[i] = gray[i] < 128 ? 0 : 255;
  }

  // render at scale
  const outW = w * scale, outH = h * scale;
  outCanvas.width = outW;
  outCanvas.height = outH;
  const fctx = outCanvas.getContext('2d');
  fctx.imageSmoothingEnabled = false;

  const pxCanvas = document.createElement('canvas');
  pxCanvas.width = w; pxCanvas.height = h;
  const pctx = pxCanvas.getContext('2d');
  const imgData = pctx.createImageData(w, h);
  for (let i = 0; i < w*h; i++) {
    imgData.data[i*4] = out[i];
    imgData.data[i*4+1] = out[i];
    imgData.data[i*4+2] = out[i];
    imgData.data[i*4+3] = 255;
  }
  pctx.putImageData(imgData, 0, 0);
  fctx.drawImage(pxCanvas, 0, 0, outW, outH);

  // sync heights
  const displayH = Math.min(600, outH);
  origImg.style.height = displayH + 'auto';
  origImg.style.width = '100%';
  origImg.style.maxWidth = '500px';
  outCanvas.style.height = displayH + 'px';
  outCanvas.style.width = 'auto';
  outCanvas.style.maxWidth = '500px';

  dlBtn.disabled = false;
}

dlBtn.addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'retratoprovisorio_' + Date.now() + '.png';
  a.href = outCanvas.toDataURL('image/png');
  a.click();
});

updateLabels();
</script>
</body>
</html>
